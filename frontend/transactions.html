<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TC Pipeline | Transactions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/assets/style.css">

    <style>
        /* ── Transactions-specific styles ────────────────── */

        /* Page header */
        .page-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
        .page-head h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; }

        /* Table wrapper */
        #table { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; margin-bottom: 24px; }
        #table h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
        .table-wrap { overflow-x: auto; }

        /* Stage badges */
        .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; line-height: 1.6; white-space: nowrap; }
        .badge.pre-contract  { background: rgba(99,102,241,.15);  color: #a5b4fc; }
        .badge.active        { background: rgba(59,130,246,.15);  color: #93c5fd; }
        .badge.inspection    { background: rgba(245,158,11,.15);  color: #fcd34d; }
        .badge.appraisal     { background: rgba(245,158,11,.15);  color: #fcd34d; }
        .badge.underwriting  { background: rgba(168,85,247,.15);  color: #d8b4fe; }
        .badge.clear-to-close{ background: rgba(34,197,94,.15);   color: #86efac; }
        .badge.closed        { background: rgba(100,116,139,.15); color: #94a3b8; }
        .badge.terminated    { background: rgba(239,68,68,.15);   color: #fca5a5; }

        /* Risk text */
        .risk-high   { color: var(--danger);  font-weight: 700; }
        .risk-medium { color: var(--warning); font-weight: 700; }
        .risk-low    { color: var(--success); font-weight: 700; }

        /* Email composer panel */
        #emailComposer {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-top: 24px;
        }
        #emailComposer h2 { font-size: 17px; font-weight: 600; margin-bottom: 20px; }
        #emailComposer .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        #emailComposer .field label { font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
        #emailComposer .composer-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }

        td a { color: var(--accent); text-decoration: none; font-weight: 600; }
        td a:hover { text-decoration: underline; }
        .empty-row td { color: var(--muted); font-size: 13.5px; padding: 20px 16px; }
    </style>
</head>
<body>

<!-- ── Top Nav ──────────────────────────────────────────── -->
<nav class="top-nav">
    <div class="nav-brand">TC<span>Pipeline</span></div>
    <div class="nav-links">
        <a href="index.html">Dashboard</a>
        <a href="add.html">New Deal</a>
        <a href="transactions.html" class="active">Transactions</a>
        <a href="settings.html">Settings</a>
        <a href="help.html">Help</a>
    </div>
    <div class="nav-right">
        <div class="nav-avatar" id="navAvatar">?</div>
    </div>
</nav>

<!-- ── Main Content ─────────────────────────────────────── -->
<div id="main">

    <div class="page-head">
        <h1>Transactions</h1>
        <a href="add.html" class="btn btn-primary">+ New Deal</a>
    </div>

    <div id="filters">
        <select id="stageFilter">
            <option value="" selected>All Stages</option>
            <option value="pre-contract">Pre-Contract</option>
            <option value="active">Active</option>
            <option value="inspection">Inspection</option>
            <option value="appraisal">Appraisal</option>
            <option value="underwriting">Underwriting</option>
            <option value="clear-to-close">Clear to Close</option>
            <option value="closed">Closed</option>
            <option value="terminated">Terminated</option>
        </select>

        <select id="riskFilter">
            <option value="" selected>All Risk</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
        </select>
    </div>

    <div id="table">
        <h2>All Transactions</h2>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>File ID</th>
                        <th>Address</th>
                        <th>Stage</th>
                        <th>Closing Date</th>
                        <th>Days to Close</th>
                        <th>Risk</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="transactionTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Email composer (hidden until opened) -->
    <div id="emailComposer" style="display:none;">
        <h2>Email Composer</h2>
        <div class="field">
            <label for="templateSelect">Select Template</label>
            <select id="templateSelect" onchange="loadTemplate()">
                <option value="">Select a Template</option>
                <option value="welcome">Welcome & Next Steps</option>
                <option value="emd">EMD Received</option>
                <option value="inspection">Inspection Complete</option>
                <option value="appraisal">Appraisal Received</option>
                <option value="ctc">Clear to Close</option>
                <option value="weekly">Weekly Status Update</option>
                <option value="postclose">Post-Close Thank You</option>
            </select>
        </div>
        <div class="field">
            <label for="subjectLine">Subject Line</label>
            <input type="text" id="subjectLine" readonly>
        </div>
        <div class="field">
            <label for="emailBody">Email Body</label>
            <textarea id="emailBody" style="min-height: 300px;"></textarea>
        </div>
        <div class="composer-actions">
            <button class="btn btn-primary" onclick="copyEmail()">Copy to Clipboard</button>
            <button class="btn btn-ghost" onclick="openInGmail()">Open in Gmail</button>
            <button class="btn btn-ghost" onclick="openInOutlook()">Open in Outlook</button>
            <button class="btn btn-ghost" onclick="closeComposer()">Close</button>
        </div>
    </div>

</div>

<!-- ── Chatbot Button ───────────────────────────────────── -->
<button id="chatbot-btn" title="TC Pipeline Assistant" onclick="alert('Chatbot coming soon!')">🤖</button>

<script src="./src/assets/transactionFilters.js"></script>
<script src="./src/assets/app.js"></script>
<script>
  /* ── Dev proxy: send /api calls to EB when on Live Server ── */
  if (window.location.port === '5500') {
    const _eb = 'http://tc-pipeline-env.eba-ugimqn2k.us-east-2.elasticbeanstalk.com';
    const _f  = window.fetch.bind(window);
    window.fetch = (u, o) => _f(typeof u === 'string' && u.startsWith('/') ? _eb + u : u, o);
  }

// ── Nav avatar ──────────────────────────────────────────
async function loadNavAvatar() {
    try {
        const res = await fetch('/api/user');
        if (!res.ok) return;
        const user = await res.json();
        const nav = document.getElementById('navAvatar');
        if (!nav) return;
        const initials = user.fullName
            ? user.fullName.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase()
            : '?';
        nav.innerHTML = '';
        if (user.profilePicUrl) {
            const img = document.createElement('img');
            img.src = user.profilePicUrl;
            nav.appendChild(img);
        } else {
            nav.textContent = initials;
        }
    } catch (e) { /* keep default */ }
}

// ── Transaction rendering ───────────────────────────────
function executeRender(filterValue = '') {
    if (typeof getTransactions === 'function') {
        renderTransactions(filterValue);
    } else {
        runLocalFallback(filterValue);
    }
}

function runLocalFallback(filter = '') {
    const tbody = document.getElementById('transactionTableBody');
    if (!tbody) return;

    const deals = JSON.parse(localStorage.getItem('tc_pipeline_deals')) || [];
    tbody.innerHTML = '';

    const searchQuery  = document.getElementById('search')      ? document.getElementById('search').value.toLowerCase().trim()      : '';
    const stageFilter  = document.getElementById('stageFilter') ? document.getElementById('stageFilter').value.toLowerCase().trim() : '';
    const riskFilter   = document.getElementById('riskFilter')  ? document.getElementById('riskFilter').value.toLowerCase().trim()  : '';

    const transactionFilter = new TransactionFilter([
        new SearchFilterStrategy(),
        new StageFilterStrategy(),
        new RiskFilterStrategy()
    ]);

    let filteredDeals = transactionFilter.applyFilters(deals, { searchQuery, stageFilter, riskFilter });

    if (filteredDeals.length === 0) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="7">No transactions found.</td></tr>';
        return;
    }

    filteredDeals.forEach(deal => {
        const stage = (deal.stage || 'active').toLowerCase().replace(/\s+/g, '-');
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${deal.fileID || '—'}</td>
            <td>${deal.propertyAddress || '—'}</td>
            <td><span class="badge ${stage}">${(deal.stage || 'Active').toUpperCase()}</span></td>
            <td>${deal.closingDate || '—'}</td>
            <td>—</td>
            <td><span class="risk-low">LOW</span></td>
            <td><a href="#" onclick="openComposer('${deal.fileID}'); return false;">Email</a></td>
        `;
        tbody.appendChild(row);
    });
}

// ── Filter event listeners ──────────────────────────────
if (document.getElementById('search')) {
    document.getElementById('search').addEventListener('input', function () {
        executeRender(this.value);
    });
}
if (document.getElementById('stageFilter')) {
    document.getElementById('stageFilter').addEventListener('change', function () {
        executeRender(document.getElementById('search') ? document.getElementById('search').value : '');
    });
}
if (document.getElementById('riskFilter')) {
    document.getElementById('riskFilter').addEventListener('change', function () {
        executeRender(document.getElementById('search') ? document.getElementById('search').value : '');
    });
}

// ── Init ────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
    executeRender();
    loadNavAvatar();
});
</script>
</body>
</html>
