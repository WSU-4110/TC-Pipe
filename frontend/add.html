<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TC Pipeline | Add Transaction</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/assets/style.css">

    <style>
        /* ── Add/Edit-specific styles ─────────────────────── */

        .page-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
        .page-head h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; }

        /* Form layout */
        #dealForm { display: flex; flex-direction: column; gap: 20px; }

        fieldset {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin: 0;
        }

        legend {
            font-size: 11.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            padding: 0 8px;
            margin-left: -4px;
        }

        .field-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field label {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        /* Milestone checkboxes */
        .milestone-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .milestone-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: border-color 0.15s;
        }

        .milestone-item:hover { border-color: var(--border2); }

        .milestone-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
            cursor: pointer;
            flex-shrink: 0;
        }

        .milestone-item label {
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            color: var(--text);
        }

        /* Form actions */
        .form-actions {
            display: flex;
            gap: 12px;
            padding: 4px 0 24px;
        }
    </style>
</head>
<body>

<!-- ── Top Nav ──────────────────────────────────────────── -->
<nav class="top-nav">
    <div class="nav-brand">TC<span>Pipeline</span></div>
    <div class="nav-links">
        <a href="index.html">Dashboard</a>
        <a href="add.html" class="active">New Deal</a>
        <a href="transactions.html">Transactions</a>
        <a href="settings.html">Settings</a>
        <a href="help.html">Help</a>
    </div>
    <div class="nav-right">
        <div class="nav-avatar" id="navAvatar">?</div>
    </div>
</nav>

<!-- ── Main Content ─────────────────────────────────────── -->
<div id="main">

    <div class="page-head">
        <h1 id="pageTitle">Add Transaction</h1>
    </div>

    <form id="dealForm">

        <fieldset>
            <legend>Basic Info</legend>
            <div class="field-grid">
                <div class="field">
                    <label for="fileID">File ID</label>
                    <input type="text" id="fileID">
                </div>
                <div class="field">
                    <label for="side">Side</label>
                    <select id="side">
                        <option value="" selected>Select Side</option>
                        <option value="buyer">Buyer</option>
                        <option value="seller">Seller</option>
                        <option value="dual">Dual Agency</option>
                    </select>
                </div>
                <div class="field">
                    <label for="propertyType">Property Type</label>
                    <select id="propertyType">
                        <option value="" selected>Select Property Type</option>
                        <option value="singleFamily">Single Family</option>
                        <option value="condoOrTownhouse">Condo/Townhouse</option>
                        <option value="multiFamily">Multi-Family</option>
                        <option value="commercial">Commercial</option>
                        <option value="landOrLot">Land/Lot</option>
                    </select>
                </div>
                <div class="field">
                    <label for="transactionType">Transaction Type</label>
                    <select id="transactionType">
                        <option value="" selected>Select Type</option>
                        <option value="standardSale">Standard Sale</option>
                        <option value="shortSale">Short Sale</option>
                        <option value="reoOrBankOwned">REO/Bank Owned</option>
                        <option value="newConstruction">New Construction</option>
                    </select>
                </div>
                <div class="field">
                    <label for="stage">Stage</label>
                    <select id="stage">
                        <option value="" selected>Select Stage</option>
                        <option value="pre-contract">Pre-Contract</option>
                        <option value="active">Active</option>
                        <option value="inspection">Inspection</option>
                        <option value="appraisal">Appraisal</option>
                        <option value="underwriting">Underwriting</option>
                        <option value="clear-to-close">Clear to Close</option>
                        <option value="closed">Closed</option>
                        <option value="terminated">Terminated</option>
                    </select>
                </div>
                <div class="field">
                    <label for="mlsNumber">MLS Number</label>
                    <input type="text" id="mlsNumber">
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Parties</legend>
            <div class="field-grid">
                <div class="field">
                    <label for="buyerName">Buyer Name</label>
                    <input type="text" id="buyerName">
                </div>
                <div class="field">
                    <label for="sellerName">Seller Name</label>
                    <input type="text" id="sellerName">
                </div>
                <div class="field">
                    <label for="listingAgent">Listing Agent</label>
                    <input type="text" id="listingAgent">
                </div>
                <div class="field">
                    <label for="assignee">Assigned To</label>
                    <input type="text" id="assignee">
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Dates &amp; Deadlines</legend>
            <div class="field-grid">
                <div class="field">
                    <label for="contractDate">Contract Date</label>
                    <input type="date" id="contractDate">
                </div>
                <div class="field">
                    <label for="closingDate">Closing Date</label>
                    <input type="date" id="closingDate">
                </div>
                <div class="field">
                    <label for="closingTime">Closing Time</label>
                    <input type="time" id="closingTime">
                </div>
                <div class="field">
                    <label for="emdDueDate">EMD Due Date</label>
                    <input type="date" id="emdDueDate">
                </div>
                <div class="field">
                    <label for="inspectionDeadline">Inspection Deadline</label>
                    <input type="date" id="inspectionDeadline">
                </div>
                <div class="field">
                    <label for="appraisalDeadline">Appraisal Deadline</label>
                    <input type="date" id="appraisalDeadline">
                </div>
                <div class="field">
                    <label for="financingContingencyDeadline">Financing Contingency Deadline</label>
                    <input type="date" id="financingContingencyDeadline">
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Location</legend>
            <div class="field-grid">
                <div class="field">
                    <label for="propertyAddress">Property Address</label>
                    <input type="text" id="propertyAddress">
                </div>
                <div class="field">
                    <label for="closingLocation">Closing Location</label>
                    <input type="text" id="closingLocation">
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Financials</legend>
            <div class="field-grid">
                <div class="field">
                    <label for="purchasePrice">Purchase Price ($)</label>
                    <input type="number" id="purchasePrice">
                </div>
                <div class="field">
                    <label for="listingPrice">Listing Price ($)</label>
                    <input type="number" id="listingPrice">
                </div>
                <div class="field">
                    <label for="emdAmount">EMD Amount ($)</label>
                    <input type="number" id="emdAmount">
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Title &amp; Lender</legend>
            <div class="field-grid">
                <div class="field">
                    <label for="titleCompanyName">Title Company Name</label>
                    <input type="text" id="titleCompanyName">
                </div>
                <div class="field">
                    <label for="titleCompanyContact">Title Company Contact</label>
                    <input type="text" id="titleCompanyContact">
                </div>
                <div class="field">
                    <label for="lenderName">Lender Name</label>
                    <input type="text" id="lenderName">
                </div>
                <div class="field">
                    <label for="lenderContact">Lender Contact</label>
                    <input type="text" id="lenderContact">
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Risk &amp; Notes</legend>
            <div class="field-grid">
                <div class="field">
                    <label for="riskLevel">Risk Level</label>
                    <select id="riskLevel">
                        <option value="" selected>Select Risk Level</option>
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <div class="field">
                    <label for="nextAction">Next Action</label>
                    <input type="text" id="nextAction">
                </div>
                <div class="field">
                    <label for="nextActionDue">Next Action Due Date</label>
                    <input type="date" id="nextActionDue">
                </div>
                <div class="field">
                    <label for="blocker">Blocker</label>
                    <input type="text" id="blocker">
                </div>
                <div class="field" style="grid-column: span 2;">
                    <label for="notes">Notes</label>
                    <textarea id="notes" style="min-height: 100px;"></textarea>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Milestones</legend>
            <div class="milestone-grid">
                <div class="milestone-item">
                    <input type="checkbox" id="earnestMoneyReceived">
                    <label for="earnestMoneyReceived">Earnest Money Received</label>
                </div>
                <div class="milestone-item">
                    <input type="checkbox" id="inspectionComplete">
                    <label for="inspectionComplete">Inspection Complete</label>
                </div>
                <div class="milestone-item">
                    <input type="checkbox" id="appraisalReceived">
                    <label for="appraisalReceived">Appraisal Received</label>
                </div>
                <div class="milestone-item">
                    <input type="checkbox" id="titleClear">
                    <label for="titleClear">Title Clear</label>
                </div>
                <div class="milestone-item">
                    <input type="checkbox" id="insuranceConfirmed">
                    <label for="insuranceConfirmed">Insurance Confirmed</label>
                </div>
                <div class="milestone-item">
                    <input type="checkbox" id="clearToCloseConfirmed">
                    <label for="clearToCloseConfirmed">Clear to Close Confirmed</label>
                </div>
            </div>
        </fieldset>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="submitBtn">Save Deal</button>
            <a href="transactions.html" class="btn btn-ghost">Cancel</a>
        </div>

    </form>
</div>

<!-- ── Chatbot Button ───────────────────────────────────── -->
<button id="chatbot-btn" title="TC Pipeline Assistant" onclick="alert('Chatbot coming soon!')">🤖</button>

<script src="./src/assets/app.js"></script>
<script>
  /* ── Dev proxy: send /api calls to EB when on Live Server ── */
  if (window.location.port === '5500') {
    const _eb = 'http://tc-pipeline-env.eba-ugimqn2k.us-east-2.elasticbeanstalk.com';
    const _f  = window.fetch.bind(window);
    window.fetch = (u, o) => _f(typeof u === 'string' && u.startsWith('/') ? _eb + u : u, o);
  }

// ── Nav avatar ──────────────────────────────────────────
async function loadNavAvatar() {
    try {
        const res = await fetch('/api/user');
        if (!res.ok) return;
        const user = await res.json();
        const nav = document.getElementById('navAvatar');
        if (!nav) return;
        const initials = user.fullName
            ? user.fullName.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase()
            : '?';
        nav.innerHTML = '';
        if (user.profilePicUrl) {
            const img = document.createElement('img');
            img.src = user.profilePicUrl;
            nav.appendChild(img);
        } else {
            nav.textContent = initials;
        }
    } catch (e) { /* keep default */ }
}

// ── Edit mode detection ─────────────────────────────────
const params = new URLSearchParams(window.location.search);
const editFileID = params.get('fileID');

if (editFileID) {
    document.getElementById('pageTitle').textContent = 'Edit Transaction';
    document.getElementById('submitBtn').textContent = 'Update Deal';
    loadTransactionForEdit(editFileID);
}

// ── Form submit ─────────────────────────────────────────
document.getElementById('dealForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const transaction = {
        fileID: document.getElementById('fileID').value.trim(),
        side: document.getElementById('side').value,
        propertyType: document.getElementById('propertyType').value,
        transactionType: document.getElementById('transactionType').value,
        stage: document.getElementById('stage').value,
        mlsNumber: document.getElementById('mlsNumber').value.trim(),
        buyerName: document.getElementById('buyerName').value.trim(),
        sellerName: document.getElementById('sellerName').value.trim(),
        listingAgent: document.getElementById('listingAgent').value.trim(),
        assignedTo: document.getElementById('assignee').value.trim(),
        propertyAddress: document.getElementById('propertyAddress').value.trim(),
        closingLocation: document.getElementById('closingLocation').value.trim(),
        contractDate: document.getElementById('contractDate').value,
        closingDate: document.getElementById('closingDate').value,
        closingTime: document.getElementById('closingTime').value,
        emdDueDate: document.getElementById('emdDueDate').value,
        inspectionDeadline: document.getElementById('inspectionDeadline').value,
        appraisalDeadline: document.getElementById('appraisalDeadline').value,
        financingContingencyDeadline: document.getElementById('financingContingencyDeadline').value,
        purchasePrice: document.getElementById('purchasePrice').value,
        listingPrice: document.getElementById('listingPrice').value,
        emdAmount: document.getElementById('emdAmount').value,
        titleCompanyName: document.getElementById('titleCompanyName').value.trim(),
        titleCompanyContact: document.getElementById('titleCompanyContact').value.trim(),
        lenderName: document.getElementById('lenderName').value.trim(),
        lenderContact: document.getElementById('lenderContact').value.trim(),
        riskLevel: document.getElementById('riskLevel').value,
        nextAction: document.getElementById('nextAction').value.trim(),
        nextActionDue: document.getElementById('nextActionDue').value,
        blocker: document.getElementById('blocker').value.trim(),
        notes: document.getElementById('notes').value.trim(),
        earnestMoneyReceived: document.getElementById('earnestMoneyReceived').checked,
        inspectionComplete: document.getElementById('inspectionComplete').checked,
        appraisalReceived: document.getElementById('appraisalReceived').checked,
        titleClear: document.getElementById('titleClear').checked,
        insuranceConfirmed: document.getElementById('insuranceConfirmed').checked,
        clearToCloseConfirmed: document.getElementById('clearToCloseConfirmed').checked,
    };

    if (!transaction.fileID) {
        alert('File ID is required.');
        return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = editFileID ? 'Saving...' : 'Saving...';

    try {
        if (editFileID) {
            await apiPut(transaction);
        } else {
            await apiPost(transaction);
        }
        window.location.href = 'transactions.html';
    } catch (err) {
        alert('Error saving deal. Please try again.');
        btn.disabled = false;
        btn.textContent = editFileID ? 'Update Deal' : 'Save Deal';
    }
});

// ── Init ────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
    loadNavAvatar();
});
</script>

</body>
</html>
