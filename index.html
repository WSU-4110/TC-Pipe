<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pipeline Tracker | Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
    <div id="sidebar">
        <a href="index.html" id="brand">TC Pipeline</a>
        <a href="index.html">Dashboard</a>
        <a href="add.html">New Deal</a>
        <a href="transactions.html">Transactions</a>
        <a href="analyzer.html">Analyzer</a>
        <a href="settings.html">Settings</a>


    </div>

    <div id="main">
    <h1>Dashboard</h1>
    <p id="greeting"></p>

        <div id="stats">
            <div class="card">
                <h2 id="statClosing">0</h2>
                <p>Closing This Week</p>
            </div>

            <div class="card">
                <h2 id="statOverdue">0</h2>
                <p>Overdue Milestones</p>
            </div>

            <div class="card">
                <h2 id="statRisk">0</h2>
                <p>High Risk Deals</p>
            </div>

        </div>

        <div id="table">
            <h2>Active Deals</h2>
            <!-- Active Deals table -->
            <table>
                <tr>
                    <th>File ID</th>
                    <th>Address</th>
                    <th>Stage</th>
                    <th>Closing Date</th>
                    <th>Days to Close</th>
                    <th>Risk</th>
                    <th>Actions</th>
                </tr>
                <tbody id="dashboardTableBody"></tbody>
            </table>

            <!-- Upcoming Deadlines table -->
            <table>
                <tr>
                    <th>File ID</th>
                    <th>Deadline Type</th>
                    <th>Due Date</th>
                    <th>Days Remaining</th>
                </tr>
                <tbody id="deadlinesTableBody"></tbody>
            </table>
        </div>
    </div>



</div>

<script src="app.js"></script>
<script>
    // greeting
    const settings = loadData('tcSettings');
    const name = settings ? settings.fullName.split(' ')[0] : 'there';
    const now = new Date();
    const hour = now.getHours();
    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const day = days[now.getDay()];
    let timeOfDay = 'Good morning';
    if (hour >= 12 && hour < 17) timeOfDay = 'Good afternoon';
    else if (hour >= 17) timeOfDay = 'Good evening';
    document.getElementById('greeting').innerHTML =
        timeOfDay + ', ' + name + ' — here\'s your pipeline for ' + day + '.';

    // dashboard
    renderDashboard();
</script>
</body>
</html>
